<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四軸組裝練習場｜國小六年級</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2b6cb0;
    --accent: #ff8a3d;
    --text: #1a365d;
    --cw: #dc2626;
    --cw-light: #fef2f2;
    --ccw: #2563eb;
    --ccw-light: #eff6ff;
    --ok: #16a34a;
    --warn: #c05621;
    --grid: #e2e8f0;
    --bar-bg: #edf2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text);
    background: #fff
      linear-gradient(to right, var(--grid) 1px, transparent 1px) 0 0/5mm 5mm,
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px) 0 0/5mm 5mm;
    min-height: 100vh;
    padding: 1.5rem 1rem;
  }
  .app {
    max-width: 1100px;
    margin: 0 auto;
    background: rgba(255,255,255,0.96);
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(26,54,93,0.08);
    padding: 1.5rem;
    border: 1px solid var(--grid);
  }
  .back-link {
    display: inline-block;
    margin-bottom: 1rem;
    color: var(--primary);
    text-decoration: none;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .back-link:hover { text-decoration: underline; }
  h1 { text-align: center; color: var(--primary); margin: 0 0 6px; font-size: 1.7rem; }
  .desc { text-align: center; margin: 0 0 22px; color: #4a5568; line-height: 1.6; }
  .desc strong { color: var(--text); }
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: #fff;
    padding: 1.2rem;
    border-radius: 14px;
    border: 2px solid var(--grid);
  }
  .panel h2 {
    margin: 0 0 14px;
    font-size: 1.1rem;
    border-bottom: 2px solid var(--grid);
    padding-bottom: 8px;
  }

  /* === Quadcopter frame === */
  .quad {
    aspect-ratio: 1 / 1;
    max-width: 460px;
    margin: 0 auto;
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 0;
  }
  .frame-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .slot {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    transition: background 0.15s;
    cursor: pointer;
    border-radius: 14px;
  }
  .slot:hover { background: #f8fafc; }
  .slot.target { background: #fef3c7; outline: 3px dashed #f59e0b; }
  .slot .label {
    font-size: 0.78rem;
    color: var(--text);
    font-weight: 700;
    margin-bottom: 4px;
    background: rgba(255,255,255,0.85);
    padding: 2px 6px;
    border-radius: 6px;
  }
  .placeholders {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
  }
  .ph {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px dashed #cbd5e0;
    display: flex; align-items: center; justify-content: center;
    background: #fafafa;
    font-size: 0.72rem;
    color: #94a3b8;
    text-align: center;
    line-height: 1.1;
    transition: all 0.2s;
  }
  .ph.prop { width: 72px; height: 72px; }
  .ph.motor:not(.filled)::before {
    content: '⚙️\A 放馬達';
    white-space: pre;
    font-size: 0.7rem;
    color: #64748b;
    font-weight: 700;
  }
  .ph.prop:not(.filled)::before {
    content: '🪶\A 放螺旋槳';
    white-space: pre;
    font-size: 0.7rem;
    color: #64748b;
    font-weight: 700;
  }
  .ph.filled { border-style: solid; }
  .ph.filled::before { content: none; }
  .ph.correct { border-color: var(--ok); background: #f0fdf4; box-shadow: 0 0 0 3px rgba(22,163,74,0.15); }
  .ph.wrong { border-color: var(--cw); background: var(--cw-light); animation: shake 0.4s; }

  .ph .motor-icon {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: #fff;
  }
  .ph .prop-icon {
    width: 56px; height: 8px;
    border-radius: 4px;
    position: relative;
  }
  .ph .prop-icon::after {
    content: '';
    position: absolute;
    top: -24px; left: 50%;
    transform: translateX(-50%);
    width: 8px; height: 56px;
    border-radius: 4px;
    background: inherit;
  }
  .icon-cw { background: var(--cw); }
  .icon-ccw { background: var(--ccw); }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  @keyframes spinR {
    from { transform: rotate(0); } to { transform: rotate(360deg); }
  }
  @keyframes spinL {
    from { transform: rotate(0); } to { transform: rotate(-360deg); }
  }
  .flying .ph.prop .prop-icon { animation: spinR 0.25s linear infinite; }
  .flying .ph.prop[data-want="ccw"] .prop-icon { animation-name: spinL; }
  .flying { animation: liftoff 1.2s ease-out; }
  @keyframes liftoff {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(-6px); }
  }

  /* === Status === */
  .status {
    text-align: center;
    padding: 14px;
    border-radius: 10px;
    background: var(--bar-bg);
    border: 2px solid var(--grid);
    margin-top: 16px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .status.ok { background: #f0fdf4; border-color: var(--ok); color: var(--ok); }
  .status.bad { background: #fef2f2; border-color: var(--cw); color: #991b1b; }
  .takeoff-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: linear-gradient(135deg, var(--primary), #1a365d);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s, transform 0.15s;
  }
  .takeoff-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .takeoff-btn:not(:disabled):hover { transform: translateY(-2px); }

  /* === Parts pool === */
  .parts-section h3 {
    margin: 0 0 8px;
    font-size: 0.95rem;
    color: var(--text);
  }
  .parts-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .part {
    border: 2px solid var(--grid);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    background: #fff;
    font-size: 0.78rem;
    color: var(--text);
    transition: all 0.15s;
    user-select: none;
  }
  .part:hover { border-color: var(--primary); transform: translateY(-2px); }
  .part.selected {
    border-color: var(--accent);
    background: #fff7ed;
    box-shadow: 0 0 0 3px rgba(255,138,61,0.25);
  }
  .part.placed { opacity: 0.3; pointer-events: none; }
  .part .swatch {
    width: 32px; height: 32px;
    border-radius: 50%;
    margin: 0 auto 4px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .part.motor .swatch.cw { background: var(--cw); }
  .part.motor .swatch.ccw { background: var(--ccw); }
  .part.prop .swatch {
    width: 36px; height: 8px;
    border-radius: 4px;
    position: relative;
    background: transparent;
    margin-top: 12px;
  }
  .part.prop .swatch::before, .part.prop .swatch::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 4px;
  }
  .part.prop .swatch.cw::before { background: var(--cw); transform: rotate(20deg); }
  .part.prop .swatch.cw::after { background: var(--cw); transform: rotate(-20deg); }
  .part.prop .swatch.ccw::before { background: var(--ccw); transform: rotate(-20deg); }
  .part.prop .swatch.ccw::after { background: var(--ccw); transform: rotate(20deg); }

  /* === Scenarios === */
  .scenarios {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--grid);
  }
  .scenarios h3 {
    margin: 0 0 10px;
    font-size: 0.95rem;
    color: var(--text);
  }
  .scenario-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .scenario-btns button {
    background: #fff;
    border: 2px solid var(--grid);
    border-radius: 8px;
    padding: 10px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    transition: all 0.15s;
  }
  .scenario-btns button:hover { border-color: var(--primary); background: #f0f9ff; }
  .scenario-btns .reset { grid-column: 1 / -1; border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .scenario-btns .reset:hover { background: #fff7ed; }

  .hint {
    margin-top: 8px;
    padding: 10px 12px;
    background: #fffbeb;
    border-left: 3px solid #f59e0b;
    border-radius: 8px;
    font-size: 0.88rem;
    color: #92400e;
    display: none;
  }
  .hint.show { display: block; }
</style>
</head>
<body>
<div class="app">
  <a class="back-link" href="lesson2-3.html">← 回第二堂課 終章</a>
  <h1>🧩 四軸組裝練習場</h1>
  <p class="desc">
    四軸需要 <strong>4 顆馬達 + 4 個螺旋槳</strong>，但每個位置該放哪一種？<br>
    <strong>挑戰</strong>：把零件放到正確位置，讓四軸成功起飛 🚀
  </p>

  <div class="layout">

    <!-- 左：四軸機架 + 起飛 -->
    <div class="panel">
      <h2>🛸 四軸機架（俯視）</h2>
      <div class="quad" id="quad">
        <svg class="frame-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="22" y1="22" x2="78" y2="78" stroke="#334155" stroke-width="5" stroke-linecap="round" />
          <line x1="78" y1="22" x2="22" y2="78" stroke="#334155" stroke-width="5" stroke-linecap="round" />
          <circle cx="50" cy="50" r="10" fill="#1e293b" />
          <text x="50" y="52.5" text-anchor="middle" fill="#fff" font-size="5" font-weight="700" font-family="'Noto Sans TC',sans-serif">飛控</text>
        </svg>

        <div class="slot" data-pos="M1">
          <span class="label">M1 · 前左</span>
          <div class="placeholders">
            <div class="ph prop" data-want="cw" data-kind="prop"></div>
            <div class="ph motor" data-want="cw" data-kind="motor"></div>
          </div>
        </div>

        <div class="slot" data-pos="M2">
          <span class="label">M2 · 前右</span>
          <div class="placeholders">
            <div class="ph prop" data-want="ccw" data-kind="prop"></div>
            <div class="ph motor" data-want="ccw" data-kind="motor"></div>
          </div>
        </div>

        <div class="slot" data-pos="M3">
          <span class="label">M3 · 後左</span>
          <div class="placeholders">
            <div class="ph prop" data-want="ccw" data-kind="prop"></div>
            <div class="ph motor" data-want="ccw" data-kind="motor"></div>
          </div>
        </div>

        <div class="slot" data-pos="M4">
          <span class="label">M4 · 後右</span>
          <div class="placeholders">
            <div class="ph prop" data-want="cw" data-kind="prop"></div>
            <div class="ph motor" data-want="cw" data-kind="motor"></div>
          </div>
        </div>
      </div>

      <div class="status" id="status">點下方零件 → 再點機架上的位置</div>
      <button class="takeoff-btn" id="takeoff" disabled>🚀 起飛測試</button>
      <div class="hint" id="hint"></div>
    </div>

    <!-- 右：零件池 + 情境 -->
    <div class="panel">
      <h2>🔧 零件池</h2>

      <div class="parts-section">
        <h3>馬達 ×4（紅黑線 = CW 正轉、白藍線 = CCW 逆轉）</h3>
        <div class="parts-row" id="motorsPool"></div>
      </div>

      <div class="parts-section">
        <h3>螺旋槳 ×4（正槳 R 配 CW 馬達、反槳 L 配 CCW 馬達）</h3>
        <div class="parts-row" id="propsPool"></div>
      </div>

      <div class="scenarios">
        <h3>💡 老師快捷情境</h3>
        <div class="scenario-btns">
          <button data-scenario="correct">✅ 全部組對</button>
          <button data-scenario="allCW">⚠️ 全裝 CW 馬達</button>
          <button data-scenario="wrongDiag">⚠️ 對角搞錯</button>
          <button data-scenario="propSwap">⚠️ 槳全裝反</button>
          <button class="reset" data-scenario="reset">🔄 全部重置</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // === State ===
  const positions = ['M1','M2','M3','M4'];
  const want = { M1:'cw', M2:'ccw', M3:'ccw', M4:'cw' };  // 對角線同方向
  let selected = null;        // {kind:'motor'|'prop', dir:'cw'|'ccw', id}
  let placed = {};            // { M1:{motor:'cw',prop:'cw'}, ... }

  positions.forEach(p => placed[p] = { motor:null, prop:null });

  // === Init parts pool ===
  function buildPool() {
    const motorsPool = document.getElementById('motorsPool');
    const propsPool  = document.getElementById('propsPool');
    motorsPool.innerHTML = '';
    propsPool.innerHTML = '';
    // 2 CW motors, 2 CCW motors
    ['cw','cw','ccw','ccw'].forEach((d,i) => {
      const el = document.createElement('div');
      el.className = 'part motor';
      el.dataset.kind = 'motor';
      el.dataset.dir = d;
      el.dataset.id = `motor-${d}-${i}`;
      el.innerHTML = `<div class="swatch ${d}">${d==='cw'?'CW':'CCW'}</div>
                      <div>${d==='cw'?'正轉 (紅黑)':'逆轉 (白藍)'}</div>`;
      el.addEventListener('click', () => selectPart(el));
      motorsPool.appendChild(el);
    });
    ['cw','cw','ccw','ccw'].forEach((d,i) => {
      const el = document.createElement('div');
      el.className = 'part prop';
      el.dataset.kind = 'prop';
      el.dataset.dir = d;
      el.dataset.id = `prop-${d}-${i}`;
      el.innerHTML = `<div class="swatch ${d}"></div>
                      <div>${d==='cw'?'正槳 (R)':'反槳 (L)'}</div>`;
      el.addEventListener('click', () => selectPart(el));
      propsPool.appendChild(el);
    });
  }

  function selectPart(el) {
    if (el.classList.contains('placed')) return;
    // Toggle: if already selected, deselect
    if (selected && selected.el === el) {
      el.classList.remove('selected');
      selected = null;
      clearTargets();
      setStatus('點下方零件 → 再點機架上的位置');
      return;
    }
    document.querySelectorAll('.part.selected').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');
    selected = { kind: el.dataset.kind, dir: el.dataset.dir, id: el.dataset.id, el };
    highlightTargets(selected.kind);
    setStatus(`已選：${labelOf(selected)}  ⤵️ 點機架上的「${selected.kind==='motor'?'馬達':'螺旋槳'}」位置`);
  }

  function labelOf(sel) {
    if (sel.kind === 'motor') return sel.dir==='cw' ? 'CW 正轉馬達 (紅黑)' : 'CCW 逆轉馬達 (白藍)';
    return sel.dir==='cw' ? '正槳 R' : '反槳 L';
  }

  function highlightTargets(kind) {
    document.querySelectorAll('.slot').forEach(s => {
      const ph = s.querySelector(`.ph.${kind}`);
      if (ph && !ph.classList.contains('filled')) s.classList.add('target');
    });
  }
  function clearTargets() {
    document.querySelectorAll('.slot.target').forEach(s => s.classList.remove('target'));
  }

  // === Slot click ===
  document.querySelectorAll('.slot').forEach(slot => {
    const pos = slot.dataset.pos;
    // Place handler on each placeholder
    slot.querySelectorAll('.ph').forEach(ph => {
      ph.addEventListener('click', e => {
        e.stopPropagation();
        const kind = ph.dataset.kind;
        // 1. If placeholder already filled → tap to remove
        if (ph.classList.contains('filled')) {
          removePart(pos, kind);
          return;
        }
        // 2. Empty + a part selected → place
        if (selected && selected.kind === kind) {
          placePart(pos, kind, selected);
        }
      });
    });
  });

  function placePart(pos, kind, sel) {
    const slot = document.querySelector(`.slot[data-pos="${pos}"]`);
    const ph = slot.querySelector(`.ph.${kind}`);
    const correct = (sel.dir === want[pos]);

    // Visually fill
    ph.classList.add('filled');
    if (kind === 'motor') {
      ph.innerHTML = `<div class="motor-icon icon-${sel.dir}">${sel.dir==='cw'?'CW':'CCW'}</div>`;
    } else {
      ph.innerHTML = `<div class="prop-icon icon-${sel.dir}"></div>`;
    }
    ph.dataset.placedDir = sel.dir;

    // Mark correct/wrong
    if (correct) {
      ph.classList.add('correct');
      ph.classList.remove('wrong');
    } else {
      ph.classList.add('wrong');
      ph.classList.remove('correct');
    }

    // Update state
    placed[pos][kind] = sel.dir;

    // Mark part as placed
    sel.el.classList.add('placed', 'is-on-' + pos + '-' + kind);
    sel.el.classList.remove('selected');
    selected = null;
    clearTargets();
    updateOverall(correct ? `✅ ${pos} 的${kind==='motor'?'馬達':'螺旋槳'}放對了！` :
      `❌ ${pos} 的${kind==='motor'?'馬達':'螺旋槳'}放錯了。${kind==='motor'?`這個位置該裝 ${want[pos].toUpperCase()} 馬達`:`這顆馬達需要配 ${want[pos]==='cw'?'正槳 R':'反槳 L'}`}`);
  }

  function removePart(pos, kind) {
    const slot = document.querySelector(`.slot[data-pos="${pos}"]`);
    const ph = slot.querySelector(`.ph.${kind}`);
    if (!ph.classList.contains('filled')) return;
    const dir = ph.dataset.placedDir;
    ph.classList.remove('filled','correct','wrong');
    ph.innerHTML = '';
    delete ph.dataset.placedDir;
    placed[pos][kind] = null;

    // Restore a corresponding part to pool
    const candidates = document.querySelectorAll(`.part.${kind}.placed[data-dir="${dir}"]`);
    if (candidates.length) candidates[0].classList.remove('placed');

    updateOverall(`移除 ${pos} 的${kind==='motor'?'馬達':'螺旋槳'}`);
  }

  // === Overall validation ===
  function updateOverall(msg) {
    const allFilled = positions.every(p => placed[p].motor && placed[p].prop);
    const allCorrect = positions.every(p => placed[p].motor === want[p] && placed[p].prop === want[p]);
    const takeoffBtn = document.getElementById('takeoff');

    if (allCorrect) {
      takeoffBtn.disabled = false;
      setStatus('✅ 全部對了！按下「起飛測試」看看 →', 'ok');
      document.getElementById('hint').classList.remove('show');
    } else if (allFilled) {
      takeoffBtn.disabled = true;
      setStatus('⚠️ 全部都放好了，但有錯誤。看上方紅色標記，調整一下', 'bad');
      showHintFromFailures();
    } else {
      takeoffBtn.disabled = true;
      setStatus(msg || '繼續放零件…');
      document.getElementById('hint').classList.remove('show');
    }
  }

  function showHintFromFailures() {
    const fails = [];
    positions.forEach(p => {
      if (placed[p].motor && placed[p].motor !== want[p])
        fails.push(`${p} 馬達該是 ${want[p].toUpperCase()}（${want[p]==='cw'?'紅黑線':'白藍線'}）`);
      if (placed[p].prop && placed[p].prop !== want[p])
        fails.push(`${p} 螺旋槳該配 ${want[p]==='cw'?'正槳 R':'反槳 L'}`);
    });
    if (fails.length) {
      const hint = document.getElementById('hint');
      hint.innerHTML = '<strong>💡 提示：</strong><br>• ' + fails.slice(0,3).join('<br>• ');
      hint.classList.add('show');
    }
  }

  function setStatus(msg, type) {
    const s = document.getElementById('status');
    s.innerText = msg;
    s.className = 'status' + (type ? ' ' + type : '');
  }

  // === Takeoff ===
  document.getElementById('takeoff').addEventListener('click', () => {
    const quad = document.getElementById('quad');
    quad.classList.add('flying');
    setStatus('🚁 起飛成功！四軸穩穩懸停在空中。反扭矩剛好兩兩抵消 ✨', 'ok');
    setTimeout(() => {
      // 顯示「下一步」訊息
      const hint = document.getElementById('hint');
      hint.innerHTML = '<strong>🎯 學到了什麼？</strong><br>• <strong>對角線同方向</strong>：M1+M4 都是 CW，M2+M3 都是 CCW<br>• <strong>馬達配螺旋槳</strong>：CW 馬達一定要配正槳 R，CCW 馬達一定要配反槳 L<br>• <strong>之後到第三堂課</strong>，你會親自調 4 顆馬達讓它飛去想去的地方！';
      hint.classList.add('show');
    }, 600);
  });

  // === Scenarios ===
  document.querySelectorAll('[data-scenario]').forEach(btn => {
    btn.addEventListener('click', () => applyScenario(btn.dataset.scenario));
  });

  function applyScenario(name) {
    // Reset everything first
    resetAll();
    if (name === 'reset') return;

    // Define scenario configs
    const configs = {
      correct:   { M1:{m:'cw',p:'cw'},  M2:{m:'ccw',p:'ccw'}, M3:{m:'ccw',p:'ccw'}, M4:{m:'cw',p:'cw'} },
      allCW:     { M1:{m:'cw',p:'cw'},  M2:{m:'cw',p:'cw'},   M3:{m:'cw',p:'cw'},   M4:{m:'cw',p:'cw'} },
      wrongDiag: { M1:{m:'cw',p:'cw'},  M2:{m:'cw',p:'cw'},   M3:{m:'ccw',p:'ccw'}, M4:{m:'ccw',p:'ccw'} },
      propSwap:  { M1:{m:'cw',p:'ccw'}, M2:{m:'ccw',p:'cw'},  M3:{m:'ccw',p:'cw'},  M4:{m:'cw',p:'ccw'} },
    };
    const cfg = configs[name];
    if (!cfg) return;

    // Apply visually
    positions.forEach(pos => {
      const slot = document.querySelector(`.slot[data-pos="${pos}"]`);
      ['motor','prop'].forEach(kind => {
        const dir = cfg[pos][kind==='motor'?'m':'p'];
        const correct = (dir === want[pos]);
        const ph = slot.querySelector(`.ph.${kind}`);
        ph.classList.add('filled', correct ? 'correct' : 'wrong');
        if (kind === 'motor') {
          ph.innerHTML = `<div class="motor-icon icon-${dir}">${dir==='cw'?'CW':'CCW'}</div>`;
        } else {
          ph.innerHTML = `<div class="prop-icon icon-${dir}"></div>`;
        }
        ph.dataset.placedDir = dir;
        placed[pos][kind] = dir;
      });
    });

    // Mark pool as placed (rough — just mark 4 motors + 4 props consumed)
    document.querySelectorAll('.part').forEach(p => p.classList.add('placed'));

    updateOverall();
  }

  function resetAll() {
    positions.forEach(p => placed[p] = { motor:null, prop:null });
    document.querySelectorAll('.ph').forEach(ph => {
      ph.classList.remove('filled','correct','wrong');
      ph.innerHTML = '';
      delete ph.dataset.placedDir;
    });
    document.querySelectorAll('.part').forEach(p => {
      p.classList.remove('placed','selected');
    });
    document.getElementById('quad').classList.remove('flying');
    document.getElementById('hint').classList.remove('show');
    selected = null;
    clearTargets();
    setStatus('點下方零件 → 再點機架上的位置');
    document.getElementById('takeoff').disabled = true;
  }

  // === Boot ===
  buildPool();
</script>
</body>
</html>
