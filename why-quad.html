    text-align: center;

    display: inline-block;
    background: #111827;
    color: #fff;

    display: block;

    font-size: 1.02rem;
    margin-bottom: 6px;

    font-size: 0.94rem;

  }

    background: #f0f9ff;
    border-left: 5px solid var(--sky);
  }

<body>
<div class="wrap">
  <nav class="topbar">
    <a href="types.html">← 回種類頁</a>
    <span>四軸漫畫</span>
  </nav>

  <header class="comic-head">
    <span class="kicker">漫畫說明</span>
    <h1>為什麼這學期專注四軸？</h1>
    <p>不是因為四軸最厲害，而是因為它最適合拿來學「飛行怎麼被控制」。</p>
  </header>

  <figure class="comic-figure">
    <img src="assets/img/why-quad-comic.png" alt="四格漫畫：固定翼需要跑道而四軸能原地起飛；四軸可用方向箭頭理解控制；螺旋槳推空氣產生反作用力；四軸能用在空拍、巡檢、救災與表演。">
    <figcaption class="comic-caption">
      看圖想一想：四軸不是每件事都最強，但它最適合初學者理解「場地、控制、力的作用、生活應用」。
    </figcaption>
  </figure>

  <section class="reason-grid" aria-label="選四軸的四個理由">
    <article class="reason-card">
      <strong>① 場地需求小</strong>
      <p>不用跑道，安全空間裡就能練習起飛、降落和懸停。</p>
    </article>
    <article class="reason-card">
      <strong>② 動作最直覺</strong>
      <p>上升、下降、前進、後退、左右移動，都能用馬達轉速來解釋。</p>
    </article>
    <article class="reason-card">
      <strong>③ 連到自然原理</strong>
      <p>螺旋槳把空氣往下推，反作用力讓無人機往上。</p>
    </article>
    <article class="reason-card">
      <strong>④ 生活中常見</strong>
      <p>空拍、巡檢、救災、燈光秀，很多例子都看得到四軸。</p>
    </article>
  </section>

  <section class="panel recap-panel">
    <h3>漫畫結論</h3>
    <p>後面講結構、玩模擬器、練習控制時，我們都會用<strong>四軸無人機</strong>當主角。</p>
  </section>
